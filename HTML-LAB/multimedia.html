<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Multimedia Demonstration</title>
</head>

<body>
    <h1>HTML Multimedia Elements</h1>

    <h2>Image Element</h2>
    <img src="images/Profile.jpg" alt="images/Profile.jpg" width="200" height="200">

    <h2>Audio Element</h2>
    <audio controls>
        <source src="media/audio.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <h2>Video Element</h2>
    <video width="320" height="240" controls>
        <source src="media/video.mp4" type="video/mp4">
        Your browser does not support the video element.
    </video>

    <h2>Embedded Educational Content</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/qz0aGYrrlhU" title="Web Development Tutorial"
        frameborder="0" allowfullscreen></iframe>
</body>

</html>
