    <header>
        <h1>Contact Me</h1>
        <nav>

    <main>
        <section>
            <h2>Get in Touch</h2>
            <p><strong>Name:</strong> Evangelista, Lance S.</p>
            <p><strong>Contact Number:</strong> 09123597921</p>
            
            <form action="#" method="post">
                <p>
                    <label for="contact-name">Your Name:</label><br>
                    <input type="text" id="contact-name" name="name" placeholder="Your Name" required>
                </p>
                <p>
                    <label for="contact-email">Your Email:</label><br>
                    <input type="email" id="contact-email" name="email" placeholder="Your Email Address" required>
                </p>
                <p>
                    <label for="contact-subject">Subject:</label><br>
                    <input type="text" id="contact-subject" name="subject" placeholder="Subject" required>
                </p>
                <p>
                    <label for="contact-message">Message:</label><br>
                    <textarea id="contact-message" name="message" rows="5" cols="40" placeholder="Type your message here..." required></textarea>
                </p>
                <p>
                    <button type="submit">Send Message</button>
                    <button type="reset">Clear Form</button>
                </p>
            </form>
        </section>
    </main>

    
</body>
